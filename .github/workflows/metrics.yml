name: Metrics
on:
  # Schedule updates (once a day)
  schedule: [{cron: "0 0 * * *"}]
  # Run manually or on push
  workflow_dispatch:
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          # Options
          user: mknas01
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Africa/Lagos
          debug: yes  # <--- Shows exact error details if something breaks
          
          # Colors (Fixed: using extras_css instead of config_style)
          extras_css: |
            body { background-color: #0D1117 !important; }
            h1, h2, h3, h4, h5, h6 { color: #A0D8FF !important; }
            .field svg { fill: #A0D8FF !important; }
            
          # 1. Languages
          plugin_languages: yes
          plugin_languages_ignored: html, css
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          
          # 2. Lines of Code
          plugin_lines: yes
          
          # 3. Habits (Fixed: Looking back 30 days to find enough data)
          plugin_habits: yes
          plugin_habits_days: 30      # <--- Increased from 14 to 30
          plugin_habits_facts: no
          plugin_habits_charts: yes
          plugin_habits_trim: yes
          plugin_habits_from: 1000    # <--- Fetch more history to ensure graph data
          
          # 4. Isometric Calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
