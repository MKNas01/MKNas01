name: Metrics
on:
  # Schedule updates (once a day)
  schedule: [{cron: "0 0 * * *"}]
  # Run manually or on push
  workflow_dispatch:
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          # Options
          user: mknas01
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Africa/Lagos
          
          # Colors (Cyan Theme)
          config_style: |
            body { background-color: #0D1117 !important; }
            h1, h2, h3, h4, h5, h6 { color: #A0D8FF !important; }
            .field svg { fill: #A0D8FF !important; }
            
          # 1. Languages (Code usage)
          plugin_languages: yes
          plugin_languages_ignored: >-
            html, css
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          
          # 2. Lines of Code
          plugin_lines: yes
          
          # 3. Habits (REMOVED due to error)
          plugin_habits: no
          
          # 4. Isometric Calendar (3D Blocks)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
