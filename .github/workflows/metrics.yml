name: Metrics
on:
  # Schedule updates (once a day)
  schedule: [{cron: "0 0 * * *"}]
  # Lines below let you run it manually and on each commit
  workflow_dispatch:
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # Your GitHub token
          token: ${{ secrets.METRICS_TOKEN }}

          # Options
          user: mknas01
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Africa/Lagos
          
          # Colors (Matches your Portfolio Cyan #A0D8FF and Dark #0D1117)
          config_style: |
            body { background-color: #0D1117 !important; }
            h1, h2, h3, h4, h5, h6 { color: #A0D8FF !important; }
            .field svg { fill: #A0D8FF !important; }
            
          # Modules
          plugin_languages: yes
          plugin_languages_ignored: >-
            html, css
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          
          plugin_lines: yes
          
          plugin_habits: yes
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_from: 200
          
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
